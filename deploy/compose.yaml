networks:
  public:
    external: true
  backend:
    driver: bridge
  api:
    driver: bridge

services:
  # body (interface)
  lyra-webui:
    container_name: lyra-webui
    env_file:
      - webui.env
    expose:
      - 8080
    image: ghcr.io/open-webui/open-webui:main
    init: true
    labels:
      - homepage.group=My Sites
      - homepage.name=Open WebUI
      - homepage.icon=open-webui
      - homepage.href=https://lyra.devgnome.com
      - kuma.__web="lyra.devgnome.com"
    logging:
      driver: syslog
      options:
        tag: lyra-webui
    networks:
      - public
    restart: unless-stopped
    user: ${USER_ID}:${GROUP_ID}
    volumes:
      - ./webui:/app/backend/data

  # container management (docker-socket-proxy)
  lyra-dockerproxy:
    container_name: lyra-dockerproxy
    #image: linuxserver/socket-proxy:3.4.6
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      #   read
      INFO: 1                 # /info, /version, /_ping
      CONTAINERS: 1           # list + inspect
      IMAGES: 1               # /images/json, needed to see what is already built
      NETWORKS: 1             # /networks, so per-session networks work
      VOLUMES: 1              # the workspace lives on one
      #   write
      POST: 1                 # the minimum that lets create/start work at all
      BUILD: 1                # the broker's scratch build path (POST /build).
                              # Added for step 4a: the broker builds session
                              # images through this. Until the host applies
                              # this, POST /build is 403 at the proxy and the
                              # broker's build endpoint is unreachable.
    networks:
      - backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    pids_limit: 256
    logging:
      driver: syslog
      options:
        tag: lyra-dockerproxy

  # workspace (open-terminal)
  lyra-terminal:
    container_name: lyra-terminal
    env_file:
      - terminal.env
    ports:
      - 8000:8000
    expose:
      - 8000 # connection to open-webui
    image: ghcr.io/open-webui/open-terminal
    #init: true
    logging:
      driver: syslog
      options:
        tag: lyra-terminal
    networks:
      - public
      - api
    restart: unless-stopped
    user: ${USER_ID}:${GROUP_ID}
    volumes:
      - ./terminal:/home/user


  # work-warp broker (the only thing that holds the Docker credential)
  #
  # STAGED, NOT YET ROLLED OUT. This file mirrors the host's working copy
  # (deploy/README.md, "Read this first"), so this service is written here for
  # review and applied on the host as an uncommitted working-tree edit — the
  # same shape the original rollout used. Until it is applied, nothing on
  # lyra_backend is the broker and /v1 has no server behind it.
  #
  # Two networks, deliberately: `api` to be reached by the callers (the
  # terminal, and later task-loom), `backend` to reach the socket proxy and
  # nothing else. The broker is the only container that joins both.
  lyra-broker:
    container_name: lyra-broker
    # Pinned to the tag the bake publishes, not :latest — the same reasoning as
    # the proxy pin below. `:develop` is the integration tag.
    image: digitaladapt/work-warp:develop
    init: true
    restart: unless-stopped
    expose:
      - 80                  # FrankenPHP's Caddy listens on 80 by default
    networks:
      - api
      - backend
    # Config and secrets ride in a file beside this one, exactly as `webui.env`
    # and `terminal.env` do for their services — and for the same reason: the
    # compose file is committed, the env file is not. It must define at least
    # APP_SECRET (the broker refuses to boot without it — the entrypoint says
    # so) and WW_TOKEN (unset, the gate refuses every /v1 request rather than
    # allowing anonymous callers). See deploy/broker.env.example.
    env_file:
      - broker.env
    environment:
      APP_ENV: prod
      # The proxy on the backend network. Not a unix socket, ever: the broker
      # reaches Docker through the TCP proxy, and `baseUrl()` refuses `unix:`
      # by name (SECURITY.md).
      WW_DOCKER_HOST: tcp://lyra-dockerproxy:2375
      # The command image — the base published by the same bake run.
      WW_IMAGE: digitaladapt/work-warp:develop-base
      WW_MAX_CONCURRENCY: "4"
      WW_TTL_GRACE: "300"
      WW_JANITOR_INTERVAL: "60"
    # Bounded like the proxy: this container holds the Docker credential, so a
    # memory or fork bomb here is the worst place to have one.
    mem_limit: 512m
    pids_limit: 512
    logging:
      driver: syslog
      options:
        tag: lyra-broker
