networks:
  public:
    external: true
  backend:
    driver: bridge
  api:
    driver: bridge

services:
  # body (interface)
  lyra-webui:
    container_name: lyra-webui
    env_file:
      - webui.env
    expose:
      - 8080
    image: ghcr.io/open-webui/open-webui:main
    init: true
    labels:
      - homepage.group=My Sites
      - homepage.name=Open WebUI
      - homepage.icon=open-webui
      - homepage.href=https://lyra.devgnome.com
      - kuma.__web="lyra.devgnome.com"
    logging:
      driver: syslog
      options:
        tag: lyra-webui
    networks:
      - public
    restart: unless-stopped
    user: ${USER_ID}:${GROUP_ID}
    volumes:
      - ./webui:/app/backend/data

  # container management (docker-socket-proxy)
  lyra-dockerproxy:
    container_name: lyra-dockerproxy
    #image: linuxserver/socket-proxy:3.4.6
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      #   read
      INFO: 1                 # /info, /version, /_ping
      CONTAINERS: 1           # list + inspect
      IMAGES: 1               # /images/json, needed to see what is already built
      NETWORKS: 1             # /networks, so per-session networks work
      VOLUMES: 1              # the workspace lives on one
      #   write
      POST: 1                 # the minimum that lets create/start work at all
    networks:
      - backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    pids_limit: 256
    logging:
      driver: syslog
      options:
        tag: lyra-dockerproxy

  # workspace (open-terminal)
  lyra-terminal:
    container_name: lyra-terminal
    env_file:
      - terminal.env
    ports:
      - 8000:8000
    expose:
      - 8000 # connection to open-webui
    image: ghcr.io/open-webui/open-terminal
    #init: true
    logging:
      driver: syslog
      options:
        tag: lyra-terminal
    networks:
      - public
      - api
    restart: unless-stopped
    user: ${USER_ID}:${GROUP_ID}
    volumes:
      - ./terminal:/home/user

