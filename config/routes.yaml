# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Attribute routes are loaded from the whole of src/, not just src/Controller/:
# this project organises by domain (Health, Exec, Sessions, Mcp), and a
# controller belongs beside the thing it exposes.
controllers:
    resource:
        path: ../src/
        namespace: App\
    type: attribute

# The MCP endpoint is declared as an attribute route on McpController like every
# other controller — it is not special-cased here on purpose. What matters about
# its path is that it sits under `/v1`, so the bearer gate (`BrokerTokenListener`,
# which covers `/v1` and only `/v1`) applies: an MCP endpoint outside the gate
# would be unauthenticated remote command execution. See McpController::PATH.
