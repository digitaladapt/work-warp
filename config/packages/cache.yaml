framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        pools:
            # MCP session storage (McpServerFactory::sessionStore()).
            #
            # A dedicated pool rather than cache.app so sessions can be flushed,
            # relocated to Redis, or expired on their own schedule without
            # disturbing the application cache. The SDK requires a store that
            # survives between requests, because the MCP handshake
            # (`initialize` → later `tools/call`) spans at least two of them —
            # under FrankenPHP as much as under any other SAPI.
            #
            # Cache-backed storage is already the documented option for
            # multi-worker deployments. If a shared backend is needed, use
            # `cache.adapter.redis` here — NOT a per-worker in-memory adapter,
            # or sessions stop resolving on any worker other than the one that
            # handled `initialize`.
            mcp_sessions:
                adapter: cache.adapter.filesystem
