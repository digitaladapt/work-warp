# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point for all custom service configuration.

parameters:
    env(LOG_LEVEL): 'info'
    env(LOCK_DSN): 'flock'

    # The URL generator's URI for non-HTTP contexts. A parameter default
    # rather than a deployment requirement, because `routing.yaml` reads it
    # with no fallback and the compile step resolves it — and this image
    # carries no `.env` (by design), so there is nothing else for it to come
    # from at boot. Same pattern as penny-track and vital-pulse; a deployment
    # that wants a different value can still set one.
    env(DEFAULT_URI): 'http://localhost'
    env(WW_DOCKER_HOST): ''
    env(WW_TOKEN): ''
    env(WW_IMAGE): 'digitaladapt/work-warp:latest-base'
    env(WW_MAX_CONCURRENCY): '2'
    env(WW_TTL_GRACE): '300'

    # The largest file a command may write, as `RLIMIT_FSIZE`. A string here
    # because it carries a unit; `App\Docker\FileSize` parses it once, at boot,
    # so a typo is a broker that refuses to start rather than a first command
    # that quietly ran with no cap. `FileSize`'s docblock carries the whole
    # argument, including the two things this does not cover.
    env(WW_MAX_FILE_SIZE): '5G'

    # The name and version the MCP server reports as its own, and that the
    # package manifest publishes. Parameters rather than literals so a release
    # sets them in one place; the version is the running build's, not whatever
    # Composer's metadata happens to say.
    ww_mcp_server_name: 'work-warp'
    ww_mcp_server_version: '1.0.0'

    # The socket proxy the broker talks to. Readiness reports whether this is
    # set at all; nothing dials it at boot, because a Docker daemon being down
    # must not stop the broker from starting (the same rule the other services
    # in this family follow for their upstreams).
    docker_host: '%env(WW_DOCKER_HOST)%'

    # The image command containers are created from. Configuration, never
    # input; published as `:<TAG>-base` by the same bake run as the broker
    # (ww-base/).
    command_image: '%env(WW_IMAGE)%'

    # How many commands may run at once in one workspace. Replaces ww-run's
    # WW_MAX_JOBS, and enforced as a pool of file locks rather than counted, so
    # it is honest after a crash. Today one session creates one workspace, so
    # this reads as a per-session cap; see DOCKER-ACCESS.md §6b for why the
    # workspace is the unit and not the session.
    max_concurrency: '%env(int:WW_MAX_CONCURRENCY)%'

    # Seconds added to a command's own timeout to form the ww.ttl label: the
    # backstop the janitor enforces when the broker did not reap its container.
    ttl_grace: '%env(int:WW_TTL_GRACE)%'

    # The per-file write cap a command container is created with. Kept as the
    # configured string here on purpose: a size carries a unit, and
    # `FileSize::parse` is the one place that knows what the units are. The
    # resolution to bytes happens in the service factory below.
    max_file_size: '%env(WW_MAX_FILE_SIZE)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Classes in src/ are services; the ones that are not are listed below and
    # excluded rather than left to fail at compile time.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # Value objects. Their constructors take scalars, enums and lists by
            # design — a typed request is not a service, and autowiring it would
            # be a category error. Slots is registered explicitly below because
            # it must be a single process-wide pool, not something the container
            # is free to construct per injection.
            - '../src/Exec/'
            - '../src/Session/'
            - '../src/Docker/'
            - '../src/Janitor/'
            - '../src/Build/'
            - '../src/Stack/'
            # The MCP surface is registered explicitly below: its tool classes
            # are services the SDK fetches by id (so they must stay public),
            # and its catalogue/manifest are plain services. Scanning the
            # namespace would register the tool *value* shapes too.
            - '../src/Mcp/'

    # Controllers are registered explicitly with the tag that lets their action
    # arguments be resolved from the request.
    App\Health\HealthController:
        tags: ['controller.service_arguments']
        arguments:
            $dockerHost: '%docker_host%'

    # The session API. Registered like every controller — explicitly, with the
    # tag — because src/Session/ is excluded from auto-registration below as a
    # value-object namespace.
    App\Session\SessionController:
        tags: ['controller.service_arguments']

    # The exec budget. Built by its static factory because a pool must be shared
    # process-wide: slot locks are held for the whole lifetime of a command, and
    # a pool constructed per request would give every slot back the moment the
    # request ended. See DOCKER-ACCESS.md §6b.
    #
    # `public: true` on purpose, and not a mistake to tidy away. It is
    # referenced by ExecRunner now, but the wiring test also fetches it by id
    # to assert the capacity came from configuration; `public` costs nothing
    # here — this is the PHP service container, not an HTTP surface.
    App\Exec\Slots:
        public: true
        factory: ['App\Exec\Slots', 'of']
        arguments:
            - '%max_concurrency%'

    # The command runner: the lifecycle from slot to result. Registered
    # explicitly because src/Exec/ is excluded from auto-registration above;
    # its DockerApi, Slots, logger and clock are autowired, and the two
    # configuration values are named because they are scalars.
    App\Exec\ExecRunner:
        arguments:
            $image: '%command_image%'
            $ttlGrace: '%ttl_grace%'
            # Not the parameter itself: a size arrives as a string, and
            # `FileSize::parse` is the one place that knows its units.
            $maxFileSize: '@App\Docker\FileSize'

    # Parsed once, at boot, from the configured size string — so an
    # unparseable value is a compile failure naming the variable, rather than
    # an exception on the first command of the first session.
    App\Docker\FileSize:
        # Public for the same reason `Slots` is: the wiring test fetches it by
        # id to assert the cap came from configuration, and `public` costs
        # nothing in the PHP service container.
        public: true
        factory: ['App\Docker\FileSize', 'parse']
        arguments:
            - '%max_file_size%'

    # The exec endpoint. A controller like any other: tagged so its action
    # arguments resolve from the request.
    App\Exec\ExecController:
        tags: ['controller.service_arguments']

    # The session's network, created lazily. Extracted when build became the
    # second caller (exec created it before every `network: session` command;
    # a build with `network: session` needs the same thing). One
    # implementation, so the two callers cannot drift.
    App\Session\SessionNetwork:
        arguments:
            $docker: '@App\Docker\DockerApi'

    # ── The session surface (GET list/show/ps, DELETE) ──────────────────────
    # The read and destroy halves, registered explicitly like every domain
    # namespace: src/Session/ is excluded from auto-registration above for its
    # value objects. All three take collaborators by type; only the ones whose
    # dependencies are excluded namespaces name them explicitly, following
    # SessionNetwork and LedgerWriter.
    #
    # SessionWorkspaces owns the *definition* of a session (a labelled
    # workspace volume), for every surface that asks — the HTTP endpoints and
    # the MCP tools both read it, which is why it is one service and not a few
    # lines in a controller.
    App\Session\SessionWorkspaces:
        arguments:
            $docker: '@App\Docker\DockerApi'

    App\Session\SessionContainers:
        arguments:
            $docker: '@App\Docker\DockerApi'

    # The ledger read goes through ExecRunner on purpose — the same rule as
    # the janitor's write: the ledger lives inside the workspace volume, and
    # the only process that can reach it is a disposable container with the
    # workspace mounted, using the same constraints and image as any command.
    App\Session\SessionLedger:
        arguments:
            $runner: '@App\Exec\ExecRunner'

    App\Session\SessionDestroyer:
        arguments:
            $docker: '@App\Docker\DockerApi'

    # ── The scratch build (step 4a) ──────────────────────────────────────────
    # Registered explicitly like every domain namespace: src/Build/ is
    # excluded above for the typed request objects and the result, which are
    # values and not services. The runner holds a slot for the whole build
    # (§6b's unit is the workspace) and its DockerApi, Slots and SessionNetwork
    # are autowired.
    App\Build\BuildRunner:
        arguments:
            $docker: '@App\Docker\DockerApi'
            $networks: '@App\Session\SessionNetwork'

    # The build endpoint. A controller like any other.
    App\Build\BuildController:
        tags: ['controller.service_arguments']

    # ── The stack harness (step 4b) ─────────────────────────────────────────
    # The compose-altitude form of the same argument: a typed vocabulary the
    # broker renders and runs itself, because a session has no daemon route to
    # run `docker compose` with, and a caller-supplied compose file is the
    # hostile-body class the design excludes. Registered explicitly like every
    # domain namespace; its DockerApi, Slots, SessionNetwork, logger and clock
    # are autowired.
    App\Stack\StackRunner:

    # The stack endpoint. A controller like any other.
    App\Stack\StackController:
        tags: ['controller.service_arguments']

    # The Docker client. One definition and one alias, so everything that
    # needs Docker asks for the interface and the test environment can swap
    # the implementation (services_test.yaml) without touching broker code.
    # Registered explicitly because src/Docker/ is excluded below, for the
    # value objects that share the namespace.
    App\Docker\HttpDockerApi:
        arguments:
            $dockerHost: '%docker_host%'

    App\Docker\DockerApi:
        alias: App\Docker\HttpDockerApi

    # ── The janitor (step 3) ─────────────────────────────────────────────────
    # The sweep's pieces, registered explicitly like every domain namespace:
    # src/Janitor/ is excluded above because it holds the report value objects,
    # which are typed results and not services.
    #
    # LedgerWriter goes through ExecRunner on purpose — the ledger line is
    # written by a disposable container with the workspace mounted, using the
    # same constraints and the same image as any command. There is no second
    # write path, and no privileged exception for "just the janitor".
    App\Janitor\LedgerWriter:
        arguments:
            $runner: '@App\Exec\ExecRunner'

    # The sweep itself: what step 3 is. Its DockerApi, LedgerWriter, logger and
    # clock are autowired; there are no scalars to name.
    App\Janitor\Janitor: ~

    # The on-demand shape (POST /v1/reap). A controller like any other.
    App\Janitor\ReapController:
        tags: ['controller.service_arguments']

    # The loop shape — the same sweep the entrypoint starts as a child of the
    # broker process (no cron, no second service; DOCKER-ACCESS.md §6a). Tagged
    # explicitly so it is registered under either autoconfiguration regime.
    App\Janitor\JanitorCommand:
        tags: ['console.command']

    # The bearer gate for /v1. It runs before routing, so an unauthenticated
    # caller gets the same answer for every /v1 path and cannot use the status
    # codes to enumerate routes. An unset token refuses with 503 rather than
    # allowing: "only the broker holds the Docker credential" is false the
    # moment anonymous callers are accepted because a variable was left blank.
    App\Security\BrokerTokenListener:
        arguments:
            $configuredToken: '%env(WW_TOKEN)%'

    # ── The MCP surface (step 5) ────────────────────────────────────────────
    # Registered explicitly like every domain namespace: src/Mcp/ is excluded
    # from auto-registration above for its value objects (the catalogue's
    # arrays, the tool classes' collaborators) and because a tool is a *service*
    # with constructor dependencies, not something the container should build
    # by scanning a directory.
    #
    # The tool classes are public on purpose: the SDK resolves a tool handler by
    # `[class, method]` through the PSR-11 container (the `service_container`
    # handed to the factory), and `has()` on a private service answers false —
    # so a private tool is a tool that cannot be called. Declared as a
    # namespace resource with `public: true` rather than four separate blocks:
    # a later individual definition would silently drop the flag (measured —
    # a per-service `public: true` followed by this resource registration left
    # every tool private, and every call answered -32603).
    App\Mcp\Tools\:
        resource: '../src/Mcp/Tools/'
        public: true

    # The catalogue and the manifest are plain services; the manifest is also
    # read by the HTTP controller.
    App\Mcp\McpPackageCatalogue: ~
    App\Mcp\McpResourceRegistrar: ~

    # Public for the same reason the tools are: `ww://pkg`'s handler is
    # `[PackageManifest::class, 'read']`, resolved through the PSR-11 container.
    # Private, the SDK falls back to `new PackageManifest()` — which needs two
    # arguments — and every resource read answers "Error while reading
    # resource" (measured).
    App\Mcp\PackageManifest:
        public: true
        arguments:
            $serverVersion: '%ww_mcp_server_version%'

    # The MCP controller. Tagged so its action argument resolves from the
    # request, like every other controller.
    App\Mcp\McpController:
        tags: ['controller.service_arguments']

    App\Mcp\PackageController:
        tags: ['controller.service_arguments']

    # The factory assembles the SDK's server per request. `$container` is the
    # service container so tool handlers resolve through PSR-11; the session
    # pool is the named `mcp_sessions` one (see config/packages/cache.yaml).
    App\Mcp\McpServerFactory:
        arguments:
            $container: '@service_container'
            $sessionPool: '@mcp_sessions'
            $serverName: '%ww_mcp_server_name%'
            $serverVersion: '%ww_mcp_server_version%'

