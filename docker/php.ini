; work-warp broker PHP runtime configuration.
; Baseline for both the CLI and the FrankenPHP worker.

memory_limit = 256M
upload_max_filesize = 2M
post_max_size = 8M

; Production-friendly opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Expose only minimal info
expose_php = Off

; Logs to stderr for 12-factor
log_errors = On
error_log = /dev/stderr
display_errors = Off

; The broker holds the only Docker credential in the system and never invents a
; time or a limit from the host's mood, so both are pinned here.
date.timezone = UTC
